<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>별빛 정원</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10182b;color:white;font-family:system-ui,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%}</style></head>
<body><canvas id="game"></canvas><script>
const c=document.querySelector('canvas'),x=c.getContext('2d');let w,h,d=1,stars=[],score=0,miss=0,active=false,last=0,spawn=0;
function size(){d=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=w*d;c.height=h*d;x.setTransform(d,0,0,d,0,0)}addEventListener('resize',size);size();
function bg(t){let g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#111a35');g.addColorStop(1,'#24445a');x.fillStyle=g;x.fillRect(0,0,w,h);for(let i=0;i<55;i++){x.fillStyle='rgba(255,255,220,.5)';x.beginPath();x.arc((i*137)%w,(i*83+t*.01)%h,1,0,7);x.fill()}x.fillStyle='#173c36';x.beginPath();x.ellipse(w/2,h+55,w*.72,125,0,0,7);x.fill()}
function drawStar(a,t){x.save();x.translate(a.x,a.y);x.rotate(t*.001);x.beginPath();for(let i=0;i<10;i++){let q=-Math.PI/2+i*Math.PI/5,r=i%2?a.r*.43:a.r;x.lineTo(Math.cos(q)*r,Math.sin(q)*r)}x.closePath();x.fillStyle='#ffe58a';x.shadowColor='#ffe58a';x.shadowBlur=16;x.fill();x.restore();x.shadowBlur=0}
function panel(title,sub,button){x.fillStyle='rgba(5,10,24,.7)';x.fillRect(0,0,w,h);x.textAlign='center';x.fillStyle='white';x.font='bold 32px system-ui';x.fillText(title,w/2,h*.4);x.font='18px system-ui';x.fillText(sub,w/2,h*.48);x.fillStyle='#ffe58a';x.fillRect(w/2-90,h*.56,180,54);x.fillStyle='#26324b';x.font='bold 18px system-ui';x.fillText(button,w/2,h*.56+35)}
function begin(){score=0;miss=0;stars=[];spawn=0;last=0;active=true;requestAnimationFrame(loop)}
function loop(t){if(!active)return;let dt=Math.min((t-last)/16.67||1,2);last=t;bg(t);spawn+=dt;if(spawn>34){stars.push({x:20+Math.random()*(w-40),y:-20,r:13+Math.random()*10,v:1+Math.random()*1.5});spawn=0}for(let i=stars.length-1;i>=0;i--){let a=stars[i];a.y+=a.v*dt;a.x+=Math.sin(t*.001+i)*.25*dt;drawStar(a,t);if(a.y>h+25){stars.splice(i,1);miss++}}x.fillStyle='white';x.font='600 20px system-ui';x.textAlign='left';x.fillText('모은 별 '+score,18,34);x.textAlign='right';x.fillText('놓친 별 '+miss,w-18,34);if(miss>=8){active=false;panel('정원 산책 끝!','모은 별: '+score,'다시 시작');return}requestAnimationFrame(loop)}
c.addEventListener('pointerdown',e=>{if(!active){begin();return}for(let i=stars.length-1;i>=0;i--){let a=stars[i];if(Math.hypot(e.clientX-a.x,e.clientY-a.y)<a.r+18){stars.splice(i,1);score++;break}}});bg(0);panel('별빛 정원','떠다니는 별을 눌러 모아 보세요','시작하기');
</script></body></html>
